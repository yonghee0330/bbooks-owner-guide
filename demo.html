  if (D.error) {
    app.innerHTML = '<div class="error"><div class="brand">B.BOOKS · 0.1평 서점</div><h1>서가 현황 페이지</h1><p>' + esc(D.error) + '</p></div>';
    return;
  }

  var thisMonth = D.today.slice(0, 7);
  var state = { tab: 'stock', q: '', type: '전체', showSold: false, month: (D.months[0] && D.months[0].month) || thisMonth, stockLimit: 40, salesLimit: 60 };
  try { var saved = sessionStorage.getItem('bb-tab'); if (saved) state.tab = saved; } catch (e) {}

  function statusBadge(s) {
    var cls = /완료$/.test(s) ? 'b-green' : /예정$/.test(s) ? 'b-amber' : s === '확인 중' ? 'b-red' : 'b-gray';
    return '<span class="badge ' + cls + '">' + esc(s) + '</span>';
  }
  function reqBadge(s) {
    var cls = s === '입고완료' || s === '승인' ? 'b-green' : s === '반려' ? 'b-red' : 'b-amber';
    return '<span class="badge ' + cls + '">' + esc(s) + '</span>';
  }

  var k = D.kpi;
  var html = '';
  html += '<div class="wrap"><header><div class="brand">B.BOOKS · 0.1평 서점</div>';
  html += '<h1>' + esc(D.owner.name) + '</h1><div class="chips">';
  (D.owner.shelves || []).forEach(function (s) { html += '<span class="chip">' + esc(s) + '</span>'; });
  html += '<span class="updated">' + esc(D.today) + ' 기준</span></div></header>';
  if (D.notice) html += '<div class="notice"><b>비북스 공지</b>' + esc(D.notice) + '</div>';
  html += '<section class="kpis">' +
    '<div class="kpi"><div class="label">지금 서가에</div><div class="value">' + n(k.stockQty) + '<small>개</small></div><div class="hint">' + n(k.stockItems) + '종</div></div>' +
    '<div class="kpi"><div class="label">이번 달 판매</div><div class="value">' + n(k.monthQty) + '<small>개</small></div><div class="hint">' + won(k.monthAmount) + '</div></div>' +
    '<div class="kpi primary"><div class="label">이번 달 정산 예정</div><div class="value">' + n(k.monthPayout) + '<small>원</small></div><div class="hint">월말 마감 후 지급</div></div>' +
    '<div class="kpi"><div class="label">받을 정산금</div><div class="value">' + n(k.unpaid) + '<small>원</small></div><div class="hint">적립·송금 전 합계</div></div>' +
    '</section>';
  html += '<nav class="tabs" role="tablist">' +
    tabBtn('stock', '재고') + tabBtn('sales', '판매 내역') + tabBtn('settle', '정산') + (D.allowRequest ? tabBtn('req', '입고 요청') : '') + '</nav>';
  html += '<section class="panel" id="p-stock"></section><section class="panel" id="p-sales"></section>' +
          '<section class="panel" id="p-settle"></section><section class="panel" id="p-req"></section>';
  html += '<footer>' + (D.contact ? '<a class="ask" href="' + esc(D.contact) + '" target="_blank" rel="noopener">비북스에 문의하기</a><br>' : '') +
          '이 페이지는 점주님 전용 링크입니다. 다른 분께 공유하지 말아 주세요.</footer></div>';
  app.innerHTML = html;

  function tabBtn(id, label) { return '<button role="tab" data-tab="' + id + '" aria-selected="false">' + label + '</button>'; }

  // ---------- 재고 ----------
  function renderStock() {
    var el = document.getElementById('p-stock');
    var types = ['전체'];
    D.items.forEach(function (i) { if (i.ty && types.indexOf(i.ty) < 0) types.push(i.ty); });
    var h = '<div class="toolbar"><input type="search" id="q" placeholder="제목으로 찾기" value="' + esc(state.q) + '">' +
            (D.items.length ? '<button class="dl" type="button" id="dlStock">엑셀로 받기</button>' : '') + '</div>';
    h += '<div class="toolbar"><div class="seg">';
    types.forEach(function (t) { h += '<button data-type="' + esc(t) + '" aria-pressed="' + (state.type === t) + '">' + esc(t) + '</button>'; });
    h += '</div><label class="check"><input type="checkbox" id="sold"' + (state.showSold ? ' checked' : '') + '> 품절 포함</label></div>';
    var q = state.q.replace(/\s+/g, '').toLowerCase();
    var list = D.items.filter(function (i) {
      if (!state.showSold && i.l <= 0) return false;
      if (state.type !== '전체' && i.ty !== state.type) return false;
      if (q && String(i.t).replace(/\s+/g, '').toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    // 제목 가나다순 (앞의 [태그]·기호는 무시)
    var sk = function (t) { return String(t).replace(/^\s*(\[[^\]]*\]\s*)+/, '').replace(/^[^0-9A-Za-z가-힣]+/, ''); };
    list.sort(function (a, b) { return sk(a.t).localeCompare(sk(b.t), 'ko'); });
    h += '<div class="summary"><span><b>' + list.length + '</b>종 · 남은 수량 <b>' + n(list.reduce(function (s, i) { return s + i.l; }, 0)) + '</b>개</span></div>';
    if (!list.length) h += '<div class="list"><div class="empty">' + (D.items.length ? '조건에 맞는 상품이 없어요.' : '등록된 입고 기록이 아직 없어요.') + '</div></div>';
    else {
      h += '<div class="list">';
      list.slice(0, state.stockLimit).forEach(function (i) {
        var badges = '';
        if (i.l <= 0) badges += '<span class="badge b-gray">품절</span>';
        if (i.u) badges += '<span class="badge b-amber">입고 확인 전</span>';
        if (i.ov) badges += '<span class="badge b-red">수량 확인 필요</span>';
        var idx = D.items.indexOf(i);
        h += '<div class="row item" data-i="' + idx + '" role="button" tabindex="0" aria-expanded="false"><div class="main"><div class="title">' + esc(i.t) + badges + '</div>' +
             (i.pb ? '<div class="pub">' + esc(i.pb) + '</div>' : '') +
             '<div class="meta">' + [i.ty, i.p ? won(i.p) : '', i.d ? md(i.d) + ' 입고' : ''].filter(Boolean).map(esc).join(' · ') + '</div></div>' +
             '<div class="side"><div class="left' + (i.l <= 0 ? ' zero' : '') + '">' + n(i.l) + '<small>개</small></div>' +
             '<div class="sub">입고 ' + n(i.in) + ' · 판매 ' + n(i.s) + (i.o ? ' · 회수 ' + n(i.o) : '') + '</div></div></div>' +
             '<div class="hist" id="hist-' + idx + '" hidden>' + histHtml(i) + '</div>';
      });
      if (list.length > state.stockLimit) h += '<button class="more" id="stockMore">더 보기 (' + (list.length - state.stockLimit) + ')</button>';
      h += '</div>';
    }
    if (D.unmatchedSales) h += '<p class="note">입고 목록과 이름이 달라 재고에서 빠지지 않은 판매가 ' + D.unmatchedSales + '건 있어요. 수량이 실제와 다르면 비북스에 알려 주세요.</p>';
    el.innerHTML = h;
    el.querySelectorAll('.row.item').forEach(function (row) {
      var toggle = function () {
        var box = document.getElementById('hist-' + row.getAttribute('data-i'));
        box.hidden = !box.hidden;
        row.setAttribute('aria-expanded', String(!box.hidden));
      };
      row.addEventListener('click', toggle);
      row.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
    });
    var qi = document.getElementById('q');
    qi.addEventListener('input', function () { state.q = qi.value; state.stockLimit = 40; renderStockKeepFocus(); });
    el.querySelectorAll('[data-type]').forEach(function (b) { b.addEventListener('click', function () { state.type = b.getAttribute('data-type'); renderStock(); }); });
    document.getElementById('sold').addEventListener('change', function (e) { state.showSold = e.target.checked; renderStock(); });
    var more = document.getElementById('stockMore');
    if (more) more.addEventListener('click', function () { state.stockLimit += 60; renderStock(); });
    var dl = document.getElementById('dlStock');
    if (dl) dl.addEventListener('click', function () { downloadStock(dl); });
  }

  // ---------- 현재고 엑셀 받기 (현재고가 있는 상품, 제목 가나다순) ----------
  function stockRows() {
    var sk = function (t) { return String(t).replace(/^\s*(\[[^\]]*\]\s*)+/, '').replace(/^[^0-9A-Za-z가-힣]+/, ''); };
    var list = D.items.filter(function (i) { return i.l > 0; }).slice().sort(function (a, b) { return sk(a.t).localeCompare(sk(b.t), 'ko'); });
    var head = ['제목', '출판사', '구분', '바코드', '판매가', '현재고', '입고 합계', '판매 합계', '회수·조정', '최근 입고일'];
    return [head].concat(list.map(function (i) {
      return [i.t, i.pb || '', i.ty || '', i.bc || '', i.p || '', i.l, i.in, i.s, i.o || 0, i.d || ''];
    }));
  }
  function saveBlob(blob, name) {
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }
  function downloadStock(btn) {
    var rows = stockRows();
    var base = (D.owner.name + '_현재고_' + D.today).replace(/[\\/:*?"<>|]/g, '');
    var label = btn.textContent;
    btn.disabled = true; btn.textContent = '만드는 중…';
    var done = function () { btn.disabled = false; btn.textContent = label; };
    var csv = function () {
      var text = rows.map(function (r) { return r.map(function (v) { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(','); }).join('\r\n');
      saveBlob(new Blob(['\ufeff' + text], { type: 'text/csv;charset=utf-8' }), base + '.csv');
      done();
    };
    var build = function () {
      try {
        var ws = XLSX.utils.aoa_to_sheet(rows);
        ws['!cols'] = [{ wch: 40 }, { wch: 16 }, { wch: 9 }, { wch: 15 }, { wch: 9 }, { wch: 7 }, { wch: 9 }, { wch: 9 }, { wch: 9 }, { wch: 12 }];
        ws['!autofilter'] = { ref: 'A1:J' + rows.length };
        var wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, '현재고');
        var out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
        saveBlob(new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), base + '.xlsx');
        done();
      } catch (e) { csv(); }
    };
    if (window.XLSX) return build();
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = build;
    s.onerror = csv;                                     // 라이브러리를 못 불러오면 CSV (엑셀에서 열림)
    document.head.appendChild(s);
  }
  function renderStockKeepFocus() {
    var pos = document.getElementById('q').selectionStart;
    renderStock();
    var qi = document.getElementById('q'); qi.focus(); try { qi.setSelectionRange(pos, pos); } catch (e) {}
  }

  function histHtml(i) {
    var line = function (label, arr) {
      if (!arr || !arr.length) return '<div class="hl"><span class="hk">' + label + '</span><span class="hv none">기록 없음</span></div>';
      return '<div class="hl"><span class="hk">' + label + '</span><span class="hv">' +
        arr.map(function (x) { return '<span class="chip2">' + esc(x[0] ? md(x[0]) : '날짜 없음') + ' · ' + n(x[1]) + '개</span>'; }).join('') + '</span></div>';
    };
    return line('입고 ' + (i.hi || []).length + '회', i.hi) + line('판매 ' + (i.hs || []).length + '회', i.hs) +
      (i.o ? '<div class="hl"><span class="hk">회수·조정</span><span class="hv">' + n(i.o) + '개</span></div>' : '');
  }

  // ---------- 판매 ----------
  function renderSales() {
    var el = document.getElementById('p-sales');
    var months = D.months.map(function (m) { return m.month; });
    if (!months.length) { el.innerHTML = '<div class="list"><div class="empty">아직 판매 기록이 없어요.</div></div>'; return; }
    var h = '<div class="toolbar"><select id="month">';
    months.forEach(function (m) { h += '<option value="' + esc(m) + '"' + (m === state.month ? ' selected' : '') + '>' + esc(monthLabel(m)) + '</option>'; });
    h += '</select></div>';
    var list = D.sales.filter(function (s) { return (s.m || s.d.slice(0, 7)) === state.month; });
    var mm = D.months.filter(function (m) { return m.month === state.month; })[0] || { qty: 0, amount: 0, payout: 0 };
    h += '<div class="summary"><span>판매 <b>' + n(mm.qty) + '</b>개 · <b>' + won(mm.amount) + '</b></span><span>정산 <b>' + won(mm.payout) + '</b></span></div>';
    h += '<div class="list">';
    list.slice(0, state.salesLimit).forEach(function (s) {
      h += '<div class="row"><div class="main"><div class="title">' + esc(s.t) + '</div>' +
           '<div class="meta">' + esc(md(s.d)) + (s.ty ? ' · ' + esc(s.ty) : '') + ' · ' + n(s.q) + '개 × ' + won(s.p) + '</div></div>' +
           '<div class="side"><div style="font-weight:700">' + won(s.po) + '</div><div class="sub">정산액</div></div></div>';
    });
    if (list.length > state.salesLimit) h += '<button class="more" id="salesMore">더 보기 (' + (list.length - state.salesLimit) + ')</button>';
    h += '</div>';
    el.innerHTML = h;
    document.getElementById('month').addEventListener('change', function (e) { state.month = e.target.value; state.salesLimit = 60; renderSales(); });
    var more = document.getElementById('salesMore');
    if (more) more.addEventListener('click', function () { state.salesLimit += 100; renderSales(); });
  }

  // ---------- 정산 ----------
  function renderSettle() {
    var el = document.getElementById('p-settle');
    if (!D.months.length) { el.innerHTML = '<div class="list"><div class="empty">아직 정산할 판매가 없어요.</div></div>'; return; }
    var h = '<div class="list">';
    D.months.forEach(function (m) {
      h += '<div class="row"><div class="main"><div class="title">' + esc(monthLabel(m.month)) + statusBadge(m.status) + '</div>' +
           '<div class="meta">판매 ' + n(m.qty) + '개 · ' + won(m.amount) + (m.paidDate ? ' · ' + esc(md(m.paidDate)) + ' 지급' : '') +
           (m.paidAmount && m.paidAmount !== m.payout ? ' · 실제 지급 ' + won(m.paidAmount) : '') + '</div>' +
           (m.boxPayout ? '<div class="split"><span>비박스 판매 정산 <b>' + won(m.boxPayout) + '</b> <em>행사 후 처리 완료</em></span>' +
                          '<span>월말 일반 판매 정산 <b>' + won(m.payout - m.boxPayout) + '</b></span></div>' : '') + '</div>' +
           '<div class="side"><div style="font-weight:750;font-size:17px">' + won(m.payout) + '</div><div class="sub">' + (m.boxPayout ? '합계' : '정산금액') + '</div></div></div>';
    });
    h += '</div><p class="note">매월 판매분은 월말에 마감해 정산합니다. 금액이 다르게 느껴지면 판매 내역 탭에서 월별 상세를 확인하고 비북스에 문의해 주세요.</p>';
    el.innerHTML = h;
  }

  // ---------- 입고 요청 (여러 권 · 알라딘 검색) ----------
  var FEE = {
    '중고': '판매 시 수수료 15% · 판매가의 85%를 정산해 드려요.',
    '굿즈': '판매 시 수수료 15% · 판매가의 85%를 정산해 드려요.',
    '새책|직접': '판매 후 수수료 10% · 정가의 90%를 정산해 드려요.',
    '새책|도매': '입고 시 정가의 ' + Math.round((D.wholesaleRate || 0.8) * 100) + '%에 구매해드리고, 판매되면 전액을 정산해드려요. (입고가 높은 일부 도서는 별도 안내)'
  };
  var cart = [], found = [], memo = '', pay = '';
  var WR = D.wholesaleRate || 0.8;
  try { var sc = JSON.parse(sessionStorage.getItem('bb-cart') || 'null'); if (sc && sc.k === D.k) { cart = sc.items || []; memo = sc.memo || ''; pay = sc.pay || ''; } } catch (e) {}
  function saveCart() { try { sessionStorage.setItem('bb-cart', JSON.stringify({ k: D.k, items: cart, memo: memo, pay: pay })); } catch (e) {} }
  var uid = 0;
  function newItem(b) {
    return { id: 'c' + Date.now().toString(36) + (uid++), src: b ? 'search' : 'manual', title: b ? b.title : '', author: b ? b.author : '',
             publisher: b ? b.publisher : '', isbn: b ? b.isbn : '', cover: b ? b.cover : '', listPrice: b && b.listPrice ? b.listPrice : '',
             type: '새책', method: '직접 입고', qty: 1, price: '' };
  }
  function isWs(c) { return c.type === '새책' && c.method === '비북스 도매주문'; }
  function unitCost(c) { return Math.round((+c.listPrice || 0) * WR); }
  function estText(c) { return +c.listPrice > 0 ? won(unitCost(c)) + ' × ' + (+c.qty || 0) + '개 = ' + won(unitCost(c) * (+c.qty || 0)) : '정가를 입력하면 계산돼요'; }
  function wsTotal() { return cart.filter(isWs).reduce(function (s, c) { return s + unitCost(c) * (+c.qty || 0); }, 0); }
  function updateTotals() {
    var q = cart.reduce(function (s, x) { return s + (+x.qty || 0); }, 0);
    document.getElementById('cartSum').textContent = cart.length ? cart.length + '종 · ' + q + '개' : '';
    document.querySelectorAll('#cart .ci').forEach(function (box) {
      var c = cart[+box.getAttribute('data-i')], e = box.querySelector('.est b');
      if (c && e) e.textContent = estText(c);
    });
    var t = document.getElementById('wsTotal'); if (t) t.textContent = won(wsTotal());
  }
  function renderPay() {
    var el = document.getElementById('payBox');
    var n = cart.filter(isWs).length;
    if (!n) { el.innerHTML = ''; return; }
    el.innerHTML = '<div class="paybox"><div class="sum"><span>도매주문 ' + n + '종 · 예상 입고가 합계</span><b id="wsTotal">' + won(wsTotal()) + '</b></div>' +
      '<div class="seg" id="paySeg"><button type="button" data-v="송금" aria-pressed="' + (pay === '송금') + '">송금</button>' +
      '<button type="button" data-v="적립금 사용" aria-pressed="' + (pay === '적립금 사용') + '">적립금 사용</button></div>' +
      (D.payAccount && pay !== '적립금 사용' ? '<div class="acct"><div class="main">비북스 송금 계좌<b id="acctNo">' + esc(D.payAccount) + '</b></div>' +
        '<button class="btn2" type="button" id="acctCopy">복사</button></div>' : '') +
      '<span class="hint">정가의 ' + Math.round(WR * 100) + '%로 계산한 예상 금액이에요. 입고가가 높은 일부 도서는 비북스에서 따로 안내드려요.</span></div>';
    el.querySelectorAll('#paySeg button').forEach(function (b) {
      b.addEventListener('click', function () { pay = b.getAttribute('data-v'); saveCart(); renderPay(); });
    });
    var cp = document.getElementById('acctCopy');
    if (cp) cp.addEventListener('click', function () {
      var text = D.payAccount.replace(/^\D*/, '').split(' ')[0];   // 계좌번호만
      var done = function () { cp.textContent = '복사됨'; setTimeout(function () { cp.textContent = '복사'; }, 1500); };
      var fallback = function () {
        var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); } catch (e) { cp.textContent = '길게 눌러 복사'; }
        ta.remove();
      };
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
    });
  }
  function feeOf(it) { return it.type === '새책' ? FEE['새책|' + (it.method === '직접 입고' ? '직접' : '도매')] : FEE[it.type]; }

  function renderReq() {
    var el = document.getElementById('p-req');
    if (!D.allowRequest) { el.innerHTML = ''; return; }
    var h = '';
    if (D.bookSearch) {
      h += '<div class="box"><h3>책 찾기 <small>알라딘 검색</small></h3>' +
        '<form class="sbar" id="sForm" autocomplete="off"><input type="search" id="sq" placeholder="제목, 저자 또는 ISBN" enterkeyhint="search">' +
        '<button class="btn2 dark" type="submit" id="sBtn">검색</button></form>' +
        '<div class="msg" id="sMsg"></div><div class="results" id="results"></div>' +
        '<div class="manual"><span>검색에 없는 책·굿즈는</span><button class="btn2" type="button" id="addManual">직접 입력 추가</button></div></div>';
    } else {
      h += '<div class="box"><h3>신청할 상품 추가</h3><div class="manual" style="margin-top:0"><span>제목·가격을 직접 적어 주세요.</span>' +
        '<button class="btn2" type="button" id="addManual">+ 상품 추가</button></div></div>';
    }
    h += '<div class="box"><h3>신청 목록 <small id="cartSum"></small></h3><div class="cart" id="cart"></div><div id="payBox"></div>' +
      '<label style="display:grid;gap:5px;font-size:12.5px;font-weight:650;color:var(--sub);margin-top:12px">기타 메모' +
      '<textarea id="memo" maxlength="300" placeholder="비북스에 남길 메모를 적어 주세요"></textarea></label>' +
      '<div class="msg" id="reqMsg" style="margin-top:10px"></div><button class="btn" type="button" id="reqBtn" style="margin-top:10px">입고 요청 보내기</button></div>';
    h += '<h2>보낸 요청</h2><div class="list" id="reqList"></div>';
    el.innerHTML = h;
    document.getElementById('memo').value = memo;
    document.getElementById('memo').addEventListener('input', function (e) { memo = e.target.value; saveCart(); });
    document.getElementById('addManual').addEventListener('click', function () {
      cart.push(newItem(null)); saveCart(); renderCart();
      var last = document.querySelector('#cart .ci:last-child input[data-f="title"]'); if (last) last.focus();
    });
    if (D.bookSearch) {
      document.getElementById('sForm').addEventListener('submit', function (e) { e.preventDefault(); doSearch(); });
    }
    document.getElementById('reqBtn').addEventListener('click', submitCart);
    renderCart(); renderReqList();
  }

  function doSearch() {
    var q = document.getElementById('sq').value.trim(), msg = document.getElementById('sMsg'), btn = document.getElementById('sBtn');
    if (!q) { msg.className = 'msg err'; msg.textContent = '제목, 저자 또는 ISBN을 입력해 주세요.'; return; }
    btn.disabled = true; btn.textContent = '찾는 중…'; msg.className = 'msg';
    google.script.run
      .withSuccessHandler(function (r) {
        btn.disabled = false; btn.textContent = '검색';
        found = r.items || [];
        if (!found.length) { msg.className = 'msg err'; msg.textContent = '검색 결과가 없어요. 다른 검색어로 찾거나 직접 입력으로 추가해 주세요.'; }
        renderResults();
      })
      .withFailureHandler(function (er) {
        btn.disabled = false; btn.textContent = '검색';
        msg.className = 'msg err'; msg.textContent = (er && er.message) || '검색하지 못했어요. 잠시 후 다시 시도해 주세요.';
      })
      .searchBooks(D.k, q);
  }
  function inCart(b) { return cart.filter(function (c) { return c.isbn && c.isbn === b.isbn; })[0]; }
  function renderResults() {
    var el = document.getElementById('results');
    el.innerHTML = found.map(function (b, i) {
      var c = inCart(b);
      return '<div class="res">' + (b.cover ? '<img src="' + esc(b.cover) + '" alt="" loading="lazy">' : '<span class="noimg"></span>') +
        '<div class="main"><div class="t">' + esc(b.title) + '</div>' +
        '<div class="m">' + [b.author, b.publisher, b.pubDate ? b.pubDate.replace('-', '.') : ''].filter(Boolean).map(esc).join(' · ') + '</div>' +
        '<div class="m num">정가 ' + (b.listPrice ? won(b.listPrice) : '정보 없음') + '</div></div>' +
        '<button class="btn2 add" type="button" data-r="' + i + '" data-in="' + (c ? 1 : 0) + '">' + (c ? '담김 ' + c.qty : '담기') + '</button></div>';
    }).join('');
    el.querySelectorAll('.add').forEach(function (bt) {
      bt.addEventListener('click', function () {
        var b = found[+bt.getAttribute('data-r')], c = inCart(b);
        if (c) c.qty = Math.min(999, (+c.qty || 0) + 1); else cart.push(newItem(b));
        saveCart(); renderResults(); renderCart();
      });
    });
  }

  function renderCart() {
    var el = document.getElementById('cart');
    var sum = document.getElementById('cartSum'), btn = document.getElementById('reqBtn');
    btn.textContent = cart.length ? cart.length + '종 입고 요청 보내기' : '입고 요청 보내기';
    btn.disabled = !cart.length;
    renderPay();
    if (!cart.length) {
      sum.textContent = '';
      el.innerHTML = '<div class="empty" style="padding:18px 8px">' + (D.bookSearch ? '위에서 책을 검색해 담거나, 직접 입력으로 추가해 주세요.' : '"+ 상품 추가"로 신청할 상품을 넣어 주세요.') + '</div>';
      return;
    }
    el.innerHTML = cart.map(function (c, i) {
      var isNew = c.type === '새책', manual = c.src === 'manual';
      var head = manual
        ? '<div class="main"><div class="grid" style="grid-template-columns:1fr">' +
            '<label>제목 (저자)<input type="text" data-f="title" maxlength="120" value="' + esc(c.title) + '" placeholder="예) 작별하지 않는다 (한강)"></label>' +
            '<label>출판사<input type="text" data-f="publisher" maxlength="60" value="' + esc(c.publisher) + '"></label></div></div>'
        : (c.cover ? '<img src="' + esc(c.cover) + '" alt="">' : '') +
          '<div class="main"><div class="t">' + esc(c.title) + '</div><div class="m">' + [c.author, c.publisher].filter(Boolean).map(esc).join(' · ') + '</div>' +
          (c.isbn ? '<div class="m num">ISBN ' + esc(c.isbn) + '</div>' : '') + '</div>';
      return '<div class="ci" data-i="' + i + '"><div class="top">' + head + '<button class="del" type="button" data-del="' + i + '" aria-label="빼기">빼기</button></div>' +
        '<div class="seg" data-seg="type">' + ['새책', '중고', '굿즈'].map(function (t) { return '<button type="button" data-v="' + t + '" aria-pressed="' + (c.type === t) + '">' + t + '</button>'; }).join('') + '</div>' +
        '<div class="seg" data-seg="method">' +
          '<button type="button" data-v="직접 입고" aria-pressed="' + (c.method === '직접 입고') + '">1. 직접 입고</button>' +
          '<button type="button" data-v="비북스 도매주문" aria-pressed="' + (c.method === '비북스 도매주문') + '"' + (isNew ? '' : ' disabled title="도매주문은 새책만 가능해요"') + '>2. 비북스 도매주문</button></div>' +
        '<div class="grid" style="grid-template-columns:.8fr 1fr 1fr">' +
          '<label>수량<input type="number" data-f="qty" min="1" max="999" inputmode="numeric" value="' + esc(c.qty) + '"></label>' +
          '<label>정가<input type="number" data-f="listPrice" min="0" inputmode="numeric" placeholder="원" value="' + esc(c.listPrice) + '"></label>' +
          '<label' + (isNew ? ' class="off"' : '') + '>판매 희망가<input type="number" data-f="price" min="0" inputmode="numeric" placeholder="' + (isNew ? '정가 판매' : '원') + '" value="' + (isNew ? '' : esc(c.price)) + '"' + (isNew ? ' disabled' : '') + '></label></div>' +
        (isWs(c) ? '<div class="est"><span>예상 입고가</span><b>' + esc(estText(c)) + '</b></div>' : '') +
        '<div class="feeline">' + esc(feeOf(c)) + '</div></div>';
    }).join('');
    updateTotals();
    el.querySelectorAll('.ci').forEach(function (box) {
      var c = cart[+box.getAttribute('data-i')];
      box.querySelectorAll('input[data-f]').forEach(function (inp) {
        inp.addEventListener('input', function () {
          c[inp.getAttribute('data-f')] = inp.value; saveCart(); updateTotals();
        });
      });
      box.querySelectorAll('[data-seg] button').forEach(function (b) {
        b.addEventListener('click', function () {
          if (b.disabled) return;
          var k = b.parentNode.getAttribute('data-seg');
          c[k] = b.getAttribute('data-v');
          if (c.type !== '새책') c.method = '직접 입고';
          saveCart(); renderCart();
        });
      });
      box.querySelector('[data-del]').addEventListener('click', function () {
        cart.splice(+box.getAttribute('data-i'), 1); saveCart(); renderCart();
        if (document.getElementById('results')) renderResults();
      });
    });
  }

  function submitCart() {
    var msg = document.getElementById('reqMsg'), btn = document.getElementById('reqBtn');
    var err = '';
    cart.some(function (c, i) {
      var no = cart.length > 1 ? (i + 1) + '번째 상품: ' : '';
      err = !String(c.title).trim() ? no + '제목을 입력해 주세요.'
        : (c.type === '새책' && !(+c.listPrice > 0)) ? no + '새책은 정가를 입력해 주세요. 정가로 판매돼요.'
        : (c.type !== '새책' && !(+c.price > 0)) ? no + '판매 희망가를 입력해 주세요.'
        : !(+c.qty >= 1) ? no + '수량을 1개 이상 입력해 주세요.' : '';
      return !!err;
    });
    if (!err && cart.some(isWs) && !pay) err = '도매주문 결제 방식(송금 / 적립금 사용)을 골라 주세요.';
    if (err) { msg.className = 'msg err'; msg.textContent = err; return; }
    var payload = { memo: memo, pay: pay, items: cart.map(function (c) {
      return { type: c.type, method: c.method, title: c.title, author: c.author, publisher: c.publisher, isbn: c.isbn, qty: c.qty,
               listPrice: c.listPrice, price: c.type === '새책' ? c.listPrice : c.price };
    }) };
    var n0 = cart.length;
    btn.disabled = true; btn.textContent = '보내는 중…'; msg.className = 'msg';
    google.script.run
      .withSuccessHandler(function (reqs) {
        D.requests = reqs; cart = []; memo = ''; pay = ''; saveCart();
        document.getElementById('memo').value = '';
        renderCart(); renderReqList(); if (document.getElementById('results')) renderResults();
        msg.className = 'msg ok'; msg.textContent = n0 + '종 입고 요청을 보냈어요. 비북스에서 확인 후 입고를 도와드릴게요.';
      })
      .withFailureHandler(function (er) {
        btn.disabled = false; btn.textContent = n0 + '종 입고 요청 보내기';
        msg.className = 'msg err'; msg.textContent = (er && er.message) || '요청을 보내지 못했어요. 잠시 후 다시 시도해 주세요.';
      })
      .submitRequest(D.k, payload);
  }
  function renderReqList() {
    var el = document.getElementById('reqList');
    if (!D.requests.length) { el.innerHTML = '<div class="empty">보낸 요청이 없어요.</div>'; return; }
    el.innerHTML = D.requests.map(function (r) {
      return '<div class="row"><div class="main"><div class="title">' + esc(r.t) + reqBadge(r.st) + '</div>' +
             '<div class="meta">' + [r.at, (r.ty || '') + ' ' + n(r.q) + '개', r.mt, r.memo].filter(Boolean).map(esc).join(' · ') + '</div></div></div>';
    }).join('');
  }

  // ---------- 탭 ----------
  var rendered = {};
  var renderers = { stock: renderStock, sales: renderSales, settle: renderSettle, req: renderReq };
  function show(tab) {
    if (!renderers[tab] || (tab === 'req' && !D.allowRequest)) tab = 'stock';
    state.tab = tab;
    try { sessionStorage.setItem('bb-tab', tab); } catch (e) {}
    document.querySelectorAll('nav.tabs button').forEach(function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-tab') === tab)); });
    document.querySelectorAll('.panel').forEach(function (p) { p.classList.toggle('on', p.id === 'p-' + tab); });
    if (!rendered[tab]) { renderers[tab](); rendered[tab] = true; }
  }
  document.querySelectorAll('nav.tabs button').forEach(function (b) { b.addEventListener('click', function () { show(b.getAttribute('data-tab')); }); });
  show(state.tab);
})();
</script>
</body>
</html>
